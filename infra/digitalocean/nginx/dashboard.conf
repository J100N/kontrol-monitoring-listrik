# Redirect HTTP ke HTTPS
server {
    listen 80;
    server_name voltguard.site www.voltguard.site;
    return 301 https://voltguard.site$request_uri;
}

# Redirect www ke non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.voltguard.site;

    ssl_certificate     /etc/letsencrypt/live/voltguard.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voltguard.site/privkey.pem;

    return 301 https://voltguard.site$request_uri;
}

# Server utama HTTPS
server {
    listen 443 ssl;
    server_name voltguard.site;

    ssl_certificate     /etc/letsencrypt/live/voltguard.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voltguard.site/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Asset SPA: cache panjang, file ber-hash dari Vite.
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # API REST diteruskan ke service api dalam jaringan Docker internal.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket realtime: upgrade header wajib untuk koneksi WS.
    location /ws {
        proxy_pass         http://realtime_gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Fallback semua route ke index.html (React Router SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
